<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Zonix Assets logo</title>
  <desc>Navy hexagonal mark with a bold Z monogram and an orange accent, next to the Zonix Assets wordmark.</desc>

  <!-- Mark: hexagon container -->
  <g>
    <polygon points="90,10 150,45 150,115 90,150 30,115 30,45"
             fill="#0B1E3D" stroke="#0B1E3D" stroke-width="2"/>
    <!-- Z monogram -->
    <path d="M52 55 H124 L124 62 L70 105 H124 V118 H50 V111 L104 68 H52 Z"
          fill="#FFFFFF"/>
    <!-- Orange accent bar cutting through the Z -->
    <rect x="46" y="78" width="88" height="10" transform="rotate(-27 90 83)"
          fill="#F5841F"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="180" y="90" font-size="52" fill="#0B1E3D">Zonix</text>
    <text x="326" y="90" font-size="52" fill="#F5841F">Assets</text>
    <text x="182" y="120" font-size="17" letter-spacing="3" fill="#6B7280" font-weight="500">DIGITAL ASSET STORE</text>
  </g>
</svg>
